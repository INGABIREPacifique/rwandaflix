<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta name="description" content="RwandaFlix — a premium streaming experience dedicated to Rwandan cinema, filmmakers and audiences around the world." />
    <meta name="keywords" content="RwandaFlix, Rwandan movies, Rwandan cinema, Rwanda series, Kigali films" />
    <meta property="og:title" content="RwandaFlix — Stories from Rwanda" />
    <meta property="og:description" content="Discover powerful stories, talented filmmakers and unforgettable characters from Rwanda." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RwandaFlix — Stories from Rwanda</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so deep-linking or
      // refreshing on a route like /rwandaflix/browse would 404. This
      // decodes the redirect that 404.html encodes, restoring the real
      // URL before React Router ever sees it. Harmless on any other host.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
